<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Parfüm Koleksiyonu</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --border: #e8e2d9;
      --border-light: #d5cbbd;
      --gold: #a68132;
      --gold-soft: #f5efe2;
      --text: #22201e;
      --muted: #7a736a;
      --hover-bg: #f6f2eb;
      --stripe: #fcfbf9;
      --shadow: 0 8px 30px rgba(34, 32, 30, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      padding: 56px 24px;
      line-height: 1.5;
    }

    .header { text-align: center; margin-bottom: 48px; }
    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
      color: var(--text);
    }
    .header h1 em { font-style: italic; color: var(--gold); font-weight: 400; }
    .header p { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.28em; text-transform: uppercase; }
    .header::after {
      content: '';
      display: block;
      width: 90px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 22px auto 0;
    }
    
    .controls {
      max-width: 980px;
      margin: 0 auto 24px;
      display: flex; gap: 16px; align-items: center;
      flex-wrap: wrap;
    }
    .filters {
      display: flex; gap: 8px;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 10px 18px;
      font-family: 'Jost', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover { border-color: var(--border-light); color: var(--text); }
    .filter-btn.active { 
      background: var(--gold); 
      border-color: var(--gold); 
      color: #ffffff; 
      box-shadow: 0 4px 12px rgba(166, 129, 50, 0.2);
    }
    
    .search-wrap { position: relative; flex: 1; min-width: 220px; }
    .search-wrap svg {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    #searchInput {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-size: 0.88rem; font-weight: 400;
      padding: 10px 16px 10px 44px;
      outline: none; letter-spacing: 0.03em;
      transition: all 0.2s ease;
    }
    #searchInput::placeholder { color: var(--muted); font-weight: 300; }
    #searchInput:focus { 
      border-color: var(--gold); 
      box-shadow: 0 0 0 3px rgba(166, 129, 50, 0.12);
    }

    .count-badge { 
      font-size: 0.8rem; 
      color: var(--muted); 
      letter-spacing: 0.06em; 
      white-space: nowrap;
      background: var(--surface);
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .count-badge span { color: var(--gold); font-weight: 500; }

    .table-wrap {
      max-width: 980px; margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border); 
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    
    thead tr { background: #f4f0e8; border-bottom: 1px solid var(--border); }
    thead th {
      font-size: 0.68rem; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); padding: 15px 18px; text-align: left;
    }
    thead th:first-child  { width: 85px; text-align: center; }
    thead th:last-child   { width: 110px; text-align: right; padding-right: 24px; }
    
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.2s ease;
      cursor: pointer;
    }
    tbody tr:nth-child(even) { background: var(--stripe); }
    tbody tr:hover { background: var(--hover-bg); }
    tbody tr:last-child { border-bottom: none; }
    
    td { padding: 10px 18px; vertical-align: middle; }
    td:first-child { width: 85px; text-align: center; padding: 8px 12px; }
    
    .perf-img-wrap {
      width: 52px; height: 68px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s ease;
      padding: 2px;
    }
    tbody tr:hover .perf-img-wrap { 
      border-color: var(--gold); 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }
    .perf-img-wrap img {
      width: 100%; height: 100%;
      object-fit: contain; object-position: center;
      display: block;
      transition: transform 0.35s ease;
    }
    tbody tr:hover .perf-img-wrap img { transform: scale(1.08); }
    .img-ph {
      font-size: 0.65rem; color: var(--border-light);
      letter-spacing: 0.05em;
      padding: 4px; text-align: center;
    }
    
    .name-container {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .name {
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem; font-weight: 600; letter-spacing: 0.01em;
    }
    .gender-tag {
      font-family: 'Jost', sans-serif;
      font-size: 0.62rem;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-block;
    }
    .gender-kadin { background: #fdf0f0; color: #b75c5c; border: 1px solid #f7d6d6; }
    .gender-erkek { background: #eef4f8; color: #467196; border: 1px solid #d4e3ee; }
    .gender-unisex { background: var(--gold-soft); color: #8c6a22; border: 1px solid #e6d8b8; }

    .price {
      color: var(--gold);
      font-size: 0.95rem;
      font-weight: 500;
      text-align: right;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    td:last-child { text-align: right; width: 110px; padding-right: 24px; }
    
    .no-results {
      text-align: center; padding: 56px 20px;
      color: var(--muted); font-size: 0.95rem; display: none;
    }
    .footer {
      max-width: 980px; margin: 28px auto 0;
      display: flex; align-items: center; justify-content: center; padding: 0 4px;
    }
    .footer p { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; }

    /* Tablet & Mobil Uyum (Responsive) */
    @media(max-width: 768px) {
      body { padding: 32px 14px; }
      .header { margin-bottom: 32px; }
      .controls { gap: 12px; }
      .search-wrap { order: 1; width: 100%; flex: none; }
      .filters { order: 2; flex: 1; }
      .filter-btn { flex: 1; text-align: center; padding: 10px 8px; font-size: 0.72rem; }
      .count-badge { order: 3; padding: 10px 12px; }
    }

    @media(max-width: 520px) {
      body { padding: 24px 10px; }
      .header h1 { font-size: 2rem; }
      
      .filters { width: 100%; flex: none; order: 2; }
      .count-badge { width: 100%; text-align: center; order: 3; padding: 6px; background: transparent; border: none; }

      thead th { padding: 12px 10px; font-size: 0.6rem; letter-spacing: 0.12em; }
      thead th:first-child { width: 64px; }
      thead th:last-child { width: 80px; padding-right: 12px; }

      td { padding: 10px 10px; }
      td:first-child { width: 64px; padding: 6px 8px; }
      td:last-child { width: 80px; padding-right: 12px; }

      .perf-img-wrap { width: 44px; height: 58px; }
      .name-container { flex-direction: column; align-items: flex-start; gap: 4px; }
      .name { font-size: 1.05rem; line-height: 1.25; }
      .gender-tag { font-size: 0.56rem; padding: 2px 7px; }
      .price { font-size: 0.85rem; }
    }
  </style>
</head>

    var tbody   = document.getElementById('tableBody');
    var input   = document.getElementById('searchInput');
    var counter = document.getElementById('visibleCount');
    var noRes   = document.getElementById('noResults');
    var filterBtns = document.querySelectorAll('.filter-btn');

    var currentSearch = '';
    var currentGender = 'all';

    function render(list) {
      while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
      noRes.style.display = list.length ? 'none' : 'block';

      list.forEach(function(p) {
        var img = imgUrl(p.link);
        var tr  = document.createElement('tr');
        
        if (p.link) {
          tr.onclick = function() { window.open(p.link, '_blank', 'noopener'); };
        }

        var tdImg  = document.createElement('td');
        var wrap = document.createElement('div');
        wrap.className = 'perf-img-wrap';
        if (img) {
          var im = document.createElement('img');
          im.src = img;
          im.alt = p.name;
          im.loading = 'lazy';
          im.referrerPolicy = 'no-referrer';
          im.onerror = function() {
            var ph = document.createElement('span');
            ph.className = 'img-ph';
            ph.textContent = '—';
            if (im.parentNode) im.parentNode.replaceChild(ph, im);
          };
          wrap.appendChild(im);
        } else {
          var ph0 = document.createElement('span');
          ph0.className = 'img-ph'; ph0.textContent = '—';
          wrap.appendChild(ph0);
        }
        tdImg.appendChild(wrap);
        tr.appendChild(tdImg);

        var tdName   = document.createElement('td');
        var nameContainer = document.createElement('div');
        nameContainer.className = 'name-container';

        var nameSpan  = document.createElement('span');
        nameSpan.className = 'name'; 
        nameSpan.textContent = p.name;
        
        var genderTag = document.createElement('span');
        genderTag.className = 'gender-tag ' + getGenderClass(p.gender);
        genderTag.textContent = p.gender;

        nameContainer.appendChild(nameSpan);
        nameContainer.appendChild(genderTag);
        tdName.appendChild(nameContainer);
        tr.appendChild(tdName);

        var tdPrice = document.createElement('td');
        tdPrice.className = 'price';
        tdPrice.textContent = p.price || '';
        tr.appendChild(tdPrice);

        tbody.appendChild(tr);
      });

      counter.textContent = list.length;
    }

    function applyFilters() {
      var filtered = perfumes.filter(function(p) {
        var matchSearch = p.name.toLowerCase().indexOf(currentSearch) !== -1;
        var matchGender = currentGender === 'all' || p.gender === currentGender;
        return matchSearch && matchGender;
      });
      render(filtered);
    }

    input.addEventListener('input', function() {
      currentSearch = input.value.toLowerCase().trim();
      applyFilters();
    });

    filterBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        filterBtns.forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        currentGender = this.getAttribute('data-gender');
        applyFilters();
      });
    });

    render(perfumes);
  </script>
